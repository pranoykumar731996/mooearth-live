name: MooEarth Live — Production Deployment Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  verify-and-build:
    name: 🛡️ Audit, Verification & Build
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🔍 Audit Mock/Fake Data (100/100 Gate)
        run: npm run test:mock-scan

      - name: 🛡️ Run Sentry Regression Sentinel
        run: npm run test:sentry

      - name: 🚀 Build Next.js Production Bundle (81 Routes)
        run: npm run build
        env:
          NEXT_PUBLIC_ENABLE_TRANSLATION: 'true'

  deploy-vercel:
    name: 🔼 Deploy to Vercel (Production)
    needs: verify-and-build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 🔼 Trigger Vercel Production Deploy
        if: env.VERCEL_TOKEN != ''
        run: |
          npx vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
          npx vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
          npx vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID || 'team_WWOTaSrnJxaFuNgtapFgbhEH' }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID || 'prj_lMO6eb2aHZpsiy3lwpY1VPXEF8Im' }}
